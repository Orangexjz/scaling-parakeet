name: RSA-512 Factorization

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  factor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instance: [1, 2, 3]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev libssl-dev libsqlite3-dev cmake make g++ python3-dev python3-flask python3-requests
      
      - name: Cache CADO-NFS binary
        id: cache-cado
        uses: actions/cache@v4
        with:
          path: /tmp/cado-nfs
          key: cado-nfs-compiled-v4
      
      - name: Clone and compile CADO-NFS
        if: steps.cache-cado.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://gitlab.inria.fr/cado-nfs/cado-nfs.git /tmp/cado-nfs
          cd /tmp/cado-nfs && make -j2
      
      - name: Restore workdir state
        uses: actions/cache@v4
        with:
          path: /tmp/cado-work
          key: cado-work-i${{ matrix.instance }}-${{ github.run_id }}
          restore-keys: |
            cado-work-i${{ matrix.instance }}-
      
      - name: Debug workdir state
        run: |
          echo "=== Workdir contents ==="
          ls -la /tmp/cado-work/ 2>/dev/null || echo "No workdir found"
          if [ -d /tmp/cado-work ]; then
            du -sh /tmp/cado-work/
            find /tmp/cado-work -name "*.checkpoint*" -o -name "*.log" 2>/dev/null | head -20
          fi
      
      - name: Run factorization (5 hours)
        run: |
          cd /tmp/cado-nfs
          START_TIME=$(date +%s)
          
          # Run CADO-NFS with timeout, capture output
          timeout 18000 python3 cado-nfs.py \
            --server-threads=2 \
            --workdir=/tmp/cado-work \
            --screenlog=INFO \
            10024736378350098430227678016352798779292618882528367487303651597605344143601617599298224756928363135181060229840615610442456500936388901255076451726534989 \
            2>&1 | tee /tmp/cado-run.log || true
          
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          echo "Factorization ran for ${ELAPSED} seconds"
          
          # If CADO-NFS exited in less than 60 seconds, something went wrong
          if [ $ELAPSED -lt 60 ]; then
            echo "WARNING: CADO-NFS exited too quickly (${ELAPSED}s). Possible resume failure."
            echo "=== Last 50 lines of log ==="
            tail -50 /tmp/cado-run.log
            echo "=== Retrying with fresh workdir ==="
            rm -rf /tmp/cado-work
            timeout 18000 python3 cado-nfs.py \
              --server-threads=2 \
              --workdir=/tmp/cado-work \
              --screenlog=INFO \
              10024736378350098430227678016352798779292618882528367487303651597605344143601617599298224756928363135181060229840615610442456500936388901255076451726534989 \
              2>&1 | tee /tmp/cado-run-fresh.log || true
          fi
      
      - name: Check for factors
        run: |
          if [ -f /tmp/cado-work/factor.log ]; then
            if grep -qE '^[pq][[:space:]]*=[[:space:]]*[0-9]' /tmp/cado-work/factor.log; then
              echo "FACTORIZATION_COMPLETE=true" >> $GITHUB_ENV
              echo "=== FACTORS FOUND ==="
              cat /tmp/cado-work/factor.log
            fi
          fi
          echo "=== Last 30 lines of CADO-NFS log ==="
          tail -30 /tmp/cado-run.log 2>/dev/null || echo "No run log"
          tail -30 /tmp/cado-run-fresh.log 2>/dev/null || true
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cado-logs-i${{ matrix.instance }}
          path: |
            /tmp/cado-run.log
            /tmp/cado-run-fresh.log
          retention-days: 7
      
      - name: Create issue on success
        if: env.FACTORIZATION_COMPLETE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const log = fs.readFileSync('/tmp/cado-work/factor.log', 'utf8');
              const pMatch = log.match(/^p\s*=\s*(\d+)/m);
              const qMatch = log.match(/^q\s*=\s*(\d+)/m);
              if (pMatch && qMatch) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: 'RSA-512 Factorization Complete!',
                  body: `## Factors Found!\n\n**p** = \`${pMatch[1]}\`\n\n**q** = \`${qMatch[1]}\`\n\nVerified: p * q = n`,
                  labels: ['complete']
                });
              }
            } catch (e) {}
